<!DOCTYPE html>
<meta charset="utf-8">
<title>Lootborne — item icons</title>
<meta name="robots" content="noindex">
<style>
  body{background:#0a0e17;color:#c9ced6;font:14px/1.6 system-ui,sans-serif;margin:0;padding:40px}
  main{max-width:760px;margin:0 auto}
  h1{color:#fff;font-size:22px;margin:0 0 4px}
  p{color:#8b94a3;margin:0 0 18px}
  code{background:#161c28;padding:2px 6px;border-radius:3px;color:#e0e6ef}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:24px}
  .grid img{width:100%;image-rendering:pixelated;background:#141a26;border-radius:4px}
</style>
<main>
  <h1>Lootborne — item icons</h1>
  <p>
    Asset host per le Steam Item Definitions di <strong>Lootborne</strong> (app 4335620).
    Icone piccole in <code>/icons/&lt;id&gt;.png</code> (200×200), grandi in
    <code>/icons_large/&lt;id&gt;.png</code> (2048×2048). Generate da
    <code>Steamworks/make_icons.py</code> nel repo del gioco — non modificare a mano.
  </p>
  <div class="grid" id="g"></div>
</main>
<script>
  // anteprima: i primi id del catalogo, giusto per verificare che Pages serva le PNG
  const g = document.getElementById('g');
  for (let id = 41; id <= 140; id++) {
    const i = document.createElement('img');
    i.src = 'icons/' + id + '.png';
    i.loading = 'lazy';
    i.onerror = () => i.remove();
    g.appendChild(i);
  }
</script>
